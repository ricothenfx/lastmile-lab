# lastmile-lab — infra + sim stack
#
# Selalu jalankan dengan project name eksplisit:
#   docker compose -p lastmile --profile infra up -d     # postgres/redis/redpanda
#   docker compose -p lastmile --profile sim up -d       # rider-sim + ws + api (Fase 1)
#
# Image backend dibangun GitHub Actions → GHCR (deploy/README.md §4);
# VPS hanya pull. Semua limit sumber daya WAJIB — total budget stack ≤ 2 GB.
# Port host mengikuti /home/rico/PORTS.md (blok lastmile).

name: lastmile

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmile-postgres
    profiles: [infra]
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmile
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: ${LASTMILE_PG_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: lastmile-redis
    profiles: [infra]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks: [internal]
    mem_limit: 64m
    cpus: 0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # Message bus — API kompatibel Kafka, hemat RAM (bukan JVM).
  # Listener internal saja (tidak dipublish ke host); dipakai mulai Fase 2.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: lastmile-redpanda
    profiles: [infra]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 400M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:19092
      - --check-enabled=false
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *log

  # ---- Fase 1: simulasi inti + streaming (image dari GHCR) ----

  # Jaringan internal saja (TIDAK dipublish ke host) — diakses ws/api gateway.
  rider-sim:
    image: ghcr.io/ricothenfx/lastmile-rider-sim:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-rider-sim
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "4201"
      RIDERS: "60"
      ORDER_RATE_PER_MIN: "20"
      SPEED_MPS: "5.5"
      TICK_HZ: "10"
      ORDER_TTL_SEC: "90"
      WEATHER_FACTOR: "1.0"
      SEED: "42"
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4201/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  ws-gateway:
    image: ghcr.io/ricothenfx/lastmile-ws-gateway:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-ws-gateway
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "3012"
      RIDER_SIM_URL: http://rider-sim:4201
      POLL_MS: "100"
    ports:
      # default loopback; di VPS di-set ke gateway jaringan Caddy (LASTMILE_BIND_IP)
      # supaya Caddy (container stack lain) bisa menjangkau — lihat deploy/README §3
      - "${LASTMILE_BIND_IP:-127.0.0.1}:3012:3012"
    depends_on:
      rider-sim:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3012/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  api-gateway:
    image: ghcr.io/ricothenfx/lastmile-api-gateway:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-api-gateway
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "3010"
      RIDER_SIM_URL: http://rider-sim:4201
    ports:
      - "${LASTMILE_BIND_IP:-127.0.0.1}:3010:3010"
    depends_on:
      rider-sim:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3010/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log
