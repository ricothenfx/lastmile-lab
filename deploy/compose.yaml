# lastmile-lab — infra + sim + pipeline stack
#
# Selalu jalankan dengan project name eksplisit:
#   docker compose -p lastmile --profile sim up -d                          # demo (Fase 1, tanpa infra — demo tak pernah mati)
#   docker compose -p lastmile --profile infra --profile sim up -d          # infra + demo
#   docker compose -p lastmile --profile infra --profile sim --profile pipeline -f deploy/compose.yaml -f deploy/compose.pipeline.yaml up -d
#                                                                           # pipeline penuh (Fase 2) + rider-sim ORDER_SOURCE=pipeline
#   ... + --profile loadtest                                                # tambah load-generator (hanya saat pengujian)
#   ... + --profile chaos                                                   # chaos injector + incident timeline (Fase 4)
#
# Image backend dibangun GitHub Actions → GHCR (deploy/README.md §4);
# VPS hanya pull. Semua limit sumber daya WAJIB — total budget stack ≤ 2 GB.
# Port host mengikuti /home/rico/PORTS.md (blok lastmile).

name: lastmile

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:
  chaos_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmile-postgres
    profiles: [infra]
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmile
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: ${LASTMILE_PG_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: lastmile-redis
    profiles: [infra]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks: [internal]
    mem_limit: 64m
    cpus: 0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # Message bus — API kompatibel Kafka, hemat RAM (bukan JVM).
  # Listener internal saja (tidak dipublish ke host).
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: lastmile-redpanda
    profiles: [infra]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 400M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:19092
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health -X brokers=127.0.0.1:19092 | grep -qE 'Healthy:[[:space:]]+true'"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *log

  # One-shot job: siapkan topic `orders` (3 partisi, RF 1 single-node).
  # Idempoten — create gagal bila sudah ada → describe sebagai konfirmasi.
  redpanda-init:
    image: redpandadata/redpanda:v24.2.7
    container_name: lastmile-redpanda-init
    profiles: [infra]
    restart: on-failure
    depends_on:
      redpanda:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        rpk topic create orders -p 3 -r 1 -X brokers=redpanda:19092 \
          || rpk topic describe orders -X brokers=redpanda:19092
    networks: [internal]
    mem_limit: 64m
    cpus: 0.2
    logging: *log

  # ---- Fase 1: simulasi inti + streaming (image dari GHCR) ----

  # Jaringan internal saja (TIDAK dipublish ke host) — diakses ws/api gateway.
  # ORDER_SOURCE=internal (default): generator Poisson internal → demo tidak
  # pernah mati tanpa infra. Override compose.pipeline.yaml mengubah ke pipeline.
  rider-sim:
    image: ghcr.io/ricothenfx/lastmile-rider-sim:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-rider-sim
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "4201"
      ORDER_SOURCE: "internal"
      DISPATCH_STRATEGY: "fifo"
      # 100 rider = kapasitas armada terukur ±25–30 order/menit (fase 3) —
      # demand default 20/menit memberi headroom, SLO steady (p95 < 6 menit)
      # terpenuhi di KPI Command Deck; surge ×10 tetap bisa melanggarnya.
      RIDERS: "100"
      ORDER_RATE_PER_MIN: "20"
      SPEED_MPS: "5.5"
      TICK_HZ: "10"
      ORDER_TTL_SEC: "90"
      WEATHER_FACTOR: "1.0"
      SURGE_FACTOR: "1.0"
      SEED: "42"
    networks: [internal]
    mem_limit: 128m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4201/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  ws-gateway:
    image: ghcr.io/ricothenfx/lastmile-ws-gateway:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-ws-gateway
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "3012"
      RIDER_SIM_URL: http://rider-sim:4201
      POLL_MS: "100"
    ports:
      # default loopback; di VPS di-set ke gateway jaringan Caddy (LASTMILE_BIND_IP)
      # supaya Caddy (container stack lain) bisa menjangkau — lihat deploy/README §3
      - "${LASTMILE_BIND_IP:-127.0.0.1}:3012:3012"
    depends_on:
      rider-sim:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3012/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  api-gateway:
    image: ghcr.io/ricothenfx/lastmile-api-gateway:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-api-gateway
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "3010"
      RIDER_SIM_URL: http://rider-sim:4201
      SIM_CONTROL_URL: http://sim-control:3013
      ORDER_INGESTION_URL: http://order-ingestion:4202
      DISPATCH_CONSUMER_URL: http://dispatch-consumer:4203
      WS_GATEWAY_URL: http://ws-gateway:3012
      LOADGEN_URL: http://loadgen:4204
      LAB_URL: http://strategy-lab:4205
      CHAOS_URL: http://chaos:4206
    ports:
      - "${LASTMILE_BIND_IP:-127.0.0.1}:3010:3010"
    depends_on:
      rider-sim:
        condition: service_healthy
      strategy-lab:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3010/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # ---- Fase 3: Strategy Lab (duel A/B strategi dispatch) ----
  # Jaringan internal saja — frontend masuk via proxy api-gateway /api/lab/*.
  # Duel berjalan virtual-time; satu duel bersamaan (ramah VPS 4 core).
  strategy-lab:
    image: ghcr.io/ricothenfx/lastmile-strategy-lab:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-strategy-lab
    profiles: [sim]
    restart: unless-stopped
    environment:
      PORT: "4205"
      MAX_RESULTS: "8"
    networks: [internal]
    mem_limit: 256m
    cpus: 1.0
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4205/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # ---- Fase 4: chaos injector + Incident Timeline (profile `chaos`) ----
  # Hanya service stateless lastmile-* yang bisa di-kill (allowlist ketat di
  # kode, ADR D19): SIGTERM ke PID 1 via Docker exec API (runtime Go keluar →
  # restart policy unless-stopped yang memulihkan). Dua alternatif terbukti
  # tidak memicu policy di Docker 29: endpoint /containers/{id}/kill (dianggap
  # stop manual) dan SIGKILL dari dalam namespace (PID 1 kebal). Pemulihan
  # tidak pernah manual. Mount docker.sock = satu-satunya service lastmile
  # dengan hak itu (root disengaja, lihat Dockerfile).
  # Incident persist di volume chaos_data (incidents.json).
  chaos:
    image: ghcr.io/ricothenfx/lastmile-chaos:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-chaos
    profiles: [chaos]
    restart: unless-stopped
    user: root
    environment:
      PORT: "4206"
      DOCKER_SOCK: /var/run/docker.sock
      DATA_DIR: /data
      PROBE_PERIOD_MS: "1000"
      PROBE_TIMEOUT_MS: "1500"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - chaos_data:/data
    networks: [internal]
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4206/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # ---- Fase 2: pipeline order (profile `pipeline`) ----

  # One-shot job migrasi (idempoten SQL). restart on-failure: exit 0 tidak diulang.
  db-migrate:
    image: postgres:16-alpine
    container_name: lastmile-db-migrate
    profiles: [pipeline]
    restart: on-failure
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${LASTMILE_PG_PASSWORD:?set in .env}
    volumes:
      - ../apps/services/migrations:/migrations:ro
    entrypoint: ["psql"]
    command:
      - "-h"
      - "postgres"
      - "-U"
      - "lastmile"
      - "-d"
      - "lastmile"
      - "-v"
      - "ON_ERROR_STOP=1"
      - "-f"
      - "/migrations/001_phase2_orders.sql"
    networks: [internal]
    mem_limit: 64m
    cpus: 0.2
    logging: *log

  order-ingestion:
    image: ghcr.io/ricothenfx/lastmile-order-ingestion:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-order-ingestion
    profiles: [pipeline]
    restart: unless-stopped
    environment:
      PORT: "4202"
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: redpanda:19092
      KAFKA_TOPIC: orders
      DATABASE_URL: postgres://lastmile:${LASTMILE_PG_PASSWORD}@postgres:5432/lastmile?sslmode=disable
      QUEUE_CAPACITY: "8192"
      IDEM_TTL_HOURS: "24"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks: [internal]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4202/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  dispatch-consumer:
    image: ghcr.io/ricothenfx/lastmile-dispatch-consumer:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-dispatch-consumer
    profiles: [pipeline]
    restart: unless-stopped
    environment:
      PORT: "4203"
      KAFKA_BROKERS: redpanda:19092
      KAFKA_TOPIC: orders
      KAFKA_GROUP: dispatch-consumer
      RIDER_SIM_URL: http://rider-sim:4201
      DATABASE_URL: postgres://lastmile:${LASTMILE_PG_PASSWORD}@postgres:5432/lastmile?sslmode=disable
      BATCH_MAX: "200"
    depends_on:
      redpanda-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
      rider-sim:
        condition: service_healthy
    networks: [internal]
    mem_limit: 96m
    cpus: 0.25
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:4203/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # Satu-satunya service pipeline yang dipublish ke host (loopback) —
  # kontrol operator; frontend masuk lewat proxy api-gateway.
  sim-control:
    image: ghcr.io/ricothenfx/lastmile-sim-control:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-sim-control
    profiles: [pipeline]
    restart: unless-stopped
    environment:
      PORT: "3013"
      RIDER_SIM_URL: http://rider-sim:4201
      LOADGEN_URL: http://loadgen:4204
    ports:
      - "127.0.0.1:3013:3013"
    depends_on:
      rider-sim:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.1
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3013/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # Hanya jalan saat pengujian beban (--profile loadtest) — BUKAN permanen.
  # RUN_DURATION_SEC > 0 → keluar sendiri setelah selesai (laporan load test).
  loadgen:
    image: ghcr.io/ricothenfx/lastmile-loadgen:${LASTMILE_IMAGE_TAG:-latest}
    container_name: lastmile-loadgen
    profiles: [loadtest]
    restart: "no"
    environment:
      PORT: "4204"
      ORDER_URL: http://order-ingestion:4202
      RATE_PER_MIN: "300"
      SPIKE_FACTOR: "10"
      SPIKE_EVERY_SEC: "90"
      SPIKE_DURATION_SEC: "60"
      RUN_DURATION_SEC: "300"
      MAX_CONCURRENCY: "64"
      SEED: "7"
    depends_on:
      order-ingestion:
        condition: service_healthy
    networks: [internal]
    mem_limit: 64m
    cpus: 0.25
    logging: *log
