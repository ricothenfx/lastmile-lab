# lastmile-lab — infra stack (Phase 0 skeleton)
#
# Selalu jalankan dengan project name eksplisit:
#   docker compose -p lastmile --profile infra up -d
#
# Fase 0: file ini belum dijalankan. Service aplikasi (Go) ditambahkan bertahap
# di Fase 2+. Semua limit sumber daya WAJIB — total budget stack ≤ 2 GB RAM.
# Port host mengikuti /home/rico/PORTS.md (blok lastmile).

name: lastmile

networks:
  internal:
    driver: bridge

volumes:
  pg_data:
  redis_data:

services:
  postgres:
    image: postgres:16-alpine
    container_name: lastmile-postgres
    profiles: [infra]
    restart: unless-stopped
    environment:
      POSTGRES_DB: lastmile
      POSTGRES_USER: lastmile
      POSTGRES_PASSWORD: ${LASTMILE_PG_PASSWORD:?set in .env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks: [internal]
    mem_limit: 384m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lastmile -d lastmile"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging: &log
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: lastmile-redis
    profiles: [infra]
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "48mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "no"]
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_data:/data
    networks: [internal]
    mem_limit: 64m
    cpus: 0.2
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 5
    logging: *log

  # Message bus — API kompatibel Kafka, hemat RAM (bukan JVM).
  # Listener internal saja (tidak dipublish ke host); dipakai mulai Fase 2.
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    container_name: lastmile-redpanda
    profiles: [infra]
    restart: unless-stopped
    command:
      - redpanda
      - start
      - --mode
      - dev-container
      - --smp
      - "1"
      - --memory
      - 400M
      - --reserve-memory
      - 0M
      - --overprovisioned
      - --kafka-addr
      - PLAINTEXT://0.0.0.0:19092
      - --advertise-kafka-addr
      - PLAINTEXT://redpanda:19092
      - --check-enabled=false
    networks: [internal]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy: true'"]
      interval: 20s
      timeout: 5s
      retries: 5
    logging: *log
