name: images

# Build image backend → GHCR supaya VPS cukup `docker compose pull`
# (aturan keras: build berat TIDAK di VPS — deploy/README.md §3.4).

on:
  push:
    branches: [main]
    paths:
      - "apps/services/**"
      - ".github/workflows/images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [rider-sim, ws-gateway, api-gateway, order-ingestion, dispatch-consumer, sim-control, loadgen, strategy-lab, chaos, copilot]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/services
          file: apps/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lastmile-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/lastmile-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  # Fase 6: push → build → image → deploy otomatis ke VPS (mode demo:
  # profile sim + chaos). Prasyarat (aksi pemilik, sekali):
  #   gh secret set DEPLOY_SSH_KEY  < ~/.ssh/<key privat khusus deploy>
  #   gh secret set DEPLOY_SSH_HOST < hostname VPS
  #   gh secret set DEPLOY_SSH_USER < user SSH (mis. rico)
  # Tanpa DEPLOY_SSH_KEY job ini SKIP dengan warning (CI tetap hijau) —
  # deploy manual tetap bisa: scripts/deploy.sh (lihat deploy/README.md §4).
  deploy:
    runs-on: ubuntu-latest
    needs: build-push
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
      DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via scripts/deploy.sh (skip bila secret belum di-set)
        run: |
          if [ -z "$DEPLOY_SSH_KEY" ]; then
            echo "::warning::Secret DEPLOY_SSH_KEY belum di-set — auto-deploy dilewati. Jalankan manual: scripts/deploy.sh (deploy/README.md §4)."
            exit 0
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          export DEPLOY_SSH_HOST="${DEPLOY_SSH_USER}@${DEPLOY_SSH_HOST}"
          export DEPLOY_SSH_KEY_FILE="$HOME/.ssh/deploy_key"
          chmod +x scripts/deploy.sh
          ./scripts/deploy.sh
