name: images

# Build image backend → GHCR supaya VPS cukup `docker compose pull`
# (aturan keras: build berat TIDAK di VPS — deploy/README.md §3.4).

on:
  push:
    branches: [main]
    paths:
      - "apps/services/**"
      - ".github/workflows/images.yaml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [rider-sim, ws-gateway, api-gateway, order-ingestion, dispatch-consumer, sim-control, loadgen, strategy-lab, chaos]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: apps/services
          file: apps/services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/lastmile-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository_owner }}/lastmile-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
